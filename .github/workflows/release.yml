name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: clang llvm libbpf-dev libnvidia-ml-dev linux-headers-generic linux-tools-common linux-tools-generic pkg-config gcc make
          version: 1.0
          
      - name: Install BPFTool
        run: |
          sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-azure || true
          if ! bpftool version >/dev/null 2>&1; then
            BPFTOOL_PATH="$(find -L /usr/lib/linux-tools /usr/lib/linux-tools-* -type f -name bpftool -print 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$BPFTOOL_PATH" ]; then
              BPFTOOL_PATH="$(dpkg -L linux-tools-common linux-tools-generic linux-tools-azure 2>/dev/null | grep '/usr/lib/linux-tools.*/bpftool$' | sort -V | tail -n 1 || true)"
            fi
            if [ -z "$BPFTOOL_PATH" ]; then
              echo "No usable bpftool binary found. Installed candidates:"
              dpkg -l 'linux-tools*' 2>/dev/null || true
              find -L /usr -type f -name bpftool -print 2>/dev/null || true
              exit 1
            fi
            sudo ln -sf "$BPFTOOL_PATH" /usr/local/bin/bpftool
          fi
          hash -r
          bpftool version

      - name: Configure CUDA toolkit path
        run: |
          NVML_HEADER="$(find /usr/local /usr/include /usr/lib/nvidia-cuda-toolkit -type f -name nvml.h -print -quit 2>/dev/null || true)"
          if [ -z "$NVML_HEADER" ]; then
            echo "nvml.h not found. Searching the filesystem:"
            find / -name 'nvml.h' 2>/dev/null || true
            dpkg -L libnvidia-ml-dev 2>/dev/null | grep -i nvml || true
            exit 1
          fi
          CUDA_HOME="$(dirname "$(dirname "$NVML_HEADER")")"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "Using CUDA_HOME=$CUDA_HOME"

      - name: Build Release Artifacts
        run: |
          make release GOARCH=amd64

      - name: Verify release archive
        run: |
          cd dist
          sha256sum -c wedjat-linux-amd64.tar.gz.sha256
          tar -tzf wedjat-linux-amd64.tar.gz >/dev/null
          
      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wedjat-linux-amd64.tar.gz
            dist/wedjat-linux-amd64.tar.gz.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
