name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/web/frontend/package-lock.json

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libnvidia-ml-dev nvidia-cuda-toolkit linux-headers-generic linux-tools-common linux-tools-generic pkg-config
          
      - name: Install BPFTool
        run: |
          sudo apt-get install -y linux-tools-$(uname -r) || true
          if ! command -v bpftool >/dev/null 2>&1; then
            BPFTOOL_PATH="$(find /usr/lib/linux-tools -type f -name bpftool -executable | sort -V | tail -n 1)"
            test -n "$BPFTOOL_PATH"
            sudo ln -sf "$BPFTOOL_PATH" /usr/local/bin/bpftool
          fi

      - name: Configure CUDA toolkit path
        run: |
          NVML_HEADER="$(find /usr/local/cuda* /usr/include /usr/lib/nvidia-cuda-toolkit -type f -name nvml.h -print -quit 2>/dev/null)"
          test -n "$NVML_HEADER"
          CUDA_HOME="$(dirname "$(dirname "$NVML_HEADER")")"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "Using CUDA_HOME=$CUDA_HOME"

      - name: Build Release Artifacts
        run: |
          make release GOARCH=amd64
          
      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wedjat-linux-amd64.tar.gz
            dist/wedjat-linux-amd64.tar.gz.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
