name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/web/package-lock.json
            ui/web/frontend/package-lock.json

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic linux-tools-common linux-tools-generic pkg-config
          
      - name: Install BPFTool
        run: |
          sudo apt-get install -y linux-tools-$(uname -r) || echo "Kernel specific tools not found, using generic"
          # Ensure bpftool is accessible
          if ! command -v bpftool &> /dev/null; then
            sudo apt-get install -y bpftool
          fi

      - name: Build Release Artifacts
        run: |
          make release GOARCH=amd64
          
      - name: Upload Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wedjat-linux-amd64.tar.gz
            dist/wedjat-linux-amd64.tar.gz.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
