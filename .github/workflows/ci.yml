name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm clang-format libbpf-dev libnvidia-ml-dev \
            nvidia-cuda-toolkit linux-headers-generic linux-tools-common \
            linux-tools-generic pkg-config

      - name: Install bpftool command
        run: |
          sudo apt-get install -y linux-tools-$(uname -r) || true
          if ! command -v bpftool >/dev/null 2>&1; then
            BPFTOOL_PATH="$(find /usr/lib/linux-tools -type f -name bpftool -executable | sort -V | tail -n 1)"
            test -n "$BPFTOOL_PATH"
            sudo ln -sf "$BPFTOOL_PATH" /usr/local/bin/bpftool
          fi

      - name: Run project checks
        run: make ci
