name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            clang llvm clang-format libbpf-dev libnvidia-ml-dev nvidia-cuda-dev \
            nvidia-cuda-toolkit linux-headers-generic linux-tools-common \
            linux-tools-generic pkg-config gcc make

      - name: Install bpftool command
        run: |
          sudo apt-get install -y bpftool || true
          if ! bpftool version >/dev/null 2>&1; then
            BPFTOOL_PATH="$(find /usr/lib/linux-tools -type f -name bpftool -executable | sort -V | tail -n 1)"
            test -n "$BPFTOOL_PATH"
            sudo ln -sf "$BPFTOOL_PATH" /usr/local/bin/bpftool
          fi
          bpftool version

      - name: Configure CUDA toolkit path
        run: |
          NVML_HEADER="$(find /usr/local /usr/include /usr/lib/nvidia-cuda-toolkit -type f -name nvml.h -print -quit 2>/dev/null || true)"
          if [ -z "$NVML_HEADER" ]; then
            echo "nvml.h not found. Searching the filesystem:"
            find / -name 'nvml.h' 2>/dev/null || true
            dpkg -L libnvidia-ml-dev nvidia-cuda-dev nvidia-cuda-toolkit 2>/dev/null | grep -i nvml || true
            exit 1
          fi
          CUDA_HOME="$(dirname "$(dirname "$NVML_HEADER")")"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "Using CUDA_HOME=$CUDA_HOME"

      - name: Run project checks
        env:
          CUDA_ARCH: sm_86
        run: make ci
