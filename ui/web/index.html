<!DOCTYPE html>
<html lang="en" data-theme="light-green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedjat — GPU Monitoring Dashboard</title>
    <meta name="description" content="Live NVIDIA GPU telemetry, CUDA tracing, processes and incidents from the Wedjat daemon." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    <script>
      // Initialize theme from localStorage before paint to avoid flash
      (function() {
        try {
          var saved = localStorage.getItem('wedjat-theme');
          if (saved === 'desert' || saved === 'light-green') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
