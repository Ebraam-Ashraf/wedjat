<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>grid paint check</title>
<style>
  body { margin: 0; background: #0f172a;
         background-image: radial-gradient(circle at 15% 50%, rgba(59,130,246,0.12), transparent 25%); }
  /* copied from .glass-panel so the canvas sits on the real backdrop */
  .glass-panel { background: rgba(30,41,59,0.7); border: 1px solid rgba(148,163,184,0.1);
                 border-radius: 16px; padding: 12px; }
  .scope-canvas { display: block; width: 100%; height: 240px; }
</style>
</head>
<body>
<div class="glass-panel" style="width:820px">
  <canvas id="c" class="scope-canvas" height="240"></canvas>
</div>
<script type="module">
import { ScopeRenderer } from './src/components/scopeRenderer.js';
import { TelemetryStore } from './src/store/telemetryStore.js';

const store = new TelemetryStore();
const canvas = document.getElementById('c');

// Feed the same shape the daemon sends: two GPUs, 500ms cadence.
let t = 1000;
for (let i = 0; i < 40; i++) {
  store.ingest({
    type: 'gpu',
    timestamp_unix_nano: (t + i * 500) * 1e6,
    data: [
      { Id: 0, TsNano: (t + i * 500) * 1e6, UtilGPU: 30 + Math.round(25 * Math.sin(i / 3)), TempC: 45 + i % 7, PowerMW: 20000 + 5000 * (i % 5), VramUsedBytes: 500, SMClockMHz: 1200 },
      { Id: 1, TsNano: (t + i * 500) * 1e6, UtilGPU: 55 + Math.round(20 * Math.cos(i / 4)), TempC: 60 + i % 5, PowerMW: 30000 + 4000 * (i % 4), VramUsedBytes: 700, SMClockMHz: 1400 },
    ],
  });
}

const renderer = new ScopeRenderer(canvas, {
  store,
  field: 'util',
  windowMs: 15000,
  delayMs: 500,
  yDomain: [0, 100],
  yTicks: [0, 25, 50, 75, 100],
  yFormat: (v) => String(v),
  valueFormat: (v) => `${Math.round(v)}%`,
});

// Draw well after the newest sample so the window is full.
renderer.draw(t + 40 * 500);
window.__ready = true;
</script>
</body>
</html>
